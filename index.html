<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بطاقة المعايدة</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">

<style>

@font-face {
  font-family: 'GuessWhat';
  src: url('Guesswhat-Exceptional.woff2') format('woff2');
}

*{
  box-sizing:border-box;
}

html, body{
  margin:0;
  padding:0;
  min-height:100vh;

  font-family:'IBM Plex Sans Arabic', sans-serif;

  background:
  radial-gradient(circle at top,#ffffff 0%,#f7f6da 45%,#efedd2 100%);

  overflow-x:hidden;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
  padding:40px 15px;
}

.main-container{

  width:100%;
  max-width:540px;

  background:rgba(255,255,255,0.58);

  backdrop-filter:blur(18px);

  border:1px solid rgba(255,255,255,0.7);

  border-radius:30px;

  padding:35px 25px;

  box-shadow:
  0 12px 40px rgba(0,0,0,0.08);

  text-align:center;

}

.company-logo{
  height:72px;
  margin-bottom:18px;
}

h2{
  margin:0;
  font-size:2rem;
  color:#111;
  font-weight:700;
}

.subtitle{
  margin-top:10px;
  margin-bottom:28px;

  color:#777;
  font-size:0.95rem;
  line-height:1.8;
}

.input-group{
  display:flex;
  flex-direction:column;
  gap:18px;
}

input{

  width:100%;

  padding:18px;

  border-radius:18px;

  border:1px solid #e4e4e4;

  background:#fff;

  font-size:1.1rem;

  outline:none;

  transition:0.25s;
}

input:focus{

  border-color:#269b55;

  box-shadow:
  0 0 0 5px rgba(38,155,85,0.12);
}

/* اختيار التصميم */

.design-options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.design-card{

  background:#fff;

  border-radius:22px;

  padding:10px;

  cursor:pointer;

  border:2px solid transparent;

  transition:0.25s;

  box-shadow:
  0 5px 20px rgba(0,0,0,0.05);
}

.design-card:hover{

  transform:translateY(-4px);

  box-shadow:
  0 12px 30px rgba(0,0,0,0.08);
}

.design-card.selected{

  border-color:#269b55;

  box-shadow:
  0 12px 35px rgba(38,155,85,0.18);
}

.design-thumb{

  width:100%;

  border-radius:16px;

  display:block;
}

.design-label{

  margin-top:10px;

  font-size:0.95rem;

  font-weight:600;

  color:#222;
}

button{

  border:none;

  background:
  linear-gradient(135deg,#269b55,#34c46f);

  color:#fff;

  padding:18px;

  border-radius:18px;

  font-size:1.15rem;

  font-weight:700;

  cursor:pointer;

  transition:0.25s;

  box-shadow:
  0 10px 25px rgba(38,155,85,0.28);
}

button:hover{

  transform:translateY(-2px);

  box-shadow:
  0 14px 35px rgba(38,155,85,0.35);
}

.hidden-container{
  position:absolute;
  top:-9999px;
  left:-9999px;

  width:1080px;
  height:1350px;

  background-repeat:no-repeat;
  background-position:center;
  background-size:cover;
}

/* الخلفيات */

.design1{
  background-image:url('https://i.imgur.com/dWiUUH1.png');
}

.design2{
  background-image:url('https://i.imgur.com/Ay45lB6.png');
}

/* الاسم */

.name{
  position:absolute;

  left:50%;
  transform:translateX(-50%);

  bottom:180px;

  width:560px;
  height:70px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#269b55;

  font-family:'GuessWhat', sans-serif;
  font-weight:400;
  font-size:32px;

  text-align:center;

  white-space:nowrap;
  overflow:hidden;
}

@media(max-width:600px){

  h2{
    font-size:1.6rem;
  }

  .main-container{
    padding:28px 18px;
    border-radius:24px;
  }

  .design-options{
    grid-template-columns:1fr;
  }

}

</style>
</head>

<body>

<div class="main-container">

  <img src="https://i.imgur.com/m4SOhEP.png" class="company-logo">

  <h2>
    بطاقة معايدة عيد الأضحى
  </h2>

  <div class="subtitle">
    اختر التصميم المناسب واكتب اسمك لتحميل بطاقة معايدة مخصصة
  </div>

  <div class="input-group">

    <input
      type="text"
      id="employeeName"
      placeholder="أدخل اسمك"
    >

    <!-- اختيار التصميم -->

    <div class="design-options">

      <div class="design-card selected" data-design="design1">

        <img
          src="https://i.imgur.com/dWiUUH1.png"
          class="design-thumb"
        >

        <div class="design-label">
          التصميم الأول
        </div>

      </div>

      <div class="design-card" data-design="design2">

        <img
          src="https://i.imgur.com/Ay45lB6.png"
          class="design-thumb"
        >

        <div class="design-label">
          التصميم الثاني
        </div>

      </div>

    </div>

    <button onclick="generateCard()">
      تحميل الصورة
    </button>

  </div>

</div>

<!-- التصميم المخفي -->

<div class="hidden-container design1" id="hiddenContainer">

  <div class="name" id="nameDisplay">
    اسم الموظف
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>

let selectedDesign = "design1";

/* اختيار التصميم */

document.querySelectorAll('.design-card').forEach(card => {

  card.addEventListener('click', () => {

    document.querySelectorAll('.design-card')
      .forEach(i => i.classList.remove('selected'));

    card.classList.add('selected');

    selectedDesign = card.dataset.design;

  });

});

/* تحميل الصورة */

function preloadImage(url){

  return new Promise((resolve, reject) => {

    const img = new Image();

    img.crossOrigin = "Anonymous";

    img.onload = () => resolve(img);

    img.onerror = () => reject();

    img.src = url;

  });

}

/* تصغير الخط تلقائياً */

function adjustFontSize(element, maxWidth){

  let fontSize = 32;

  const minFontSize = 18;

  const context = document
    .createElement("canvas")
    .getContext("2d");

  while(fontSize >= minFontSize){

    context.font =
      `400 ${fontSize}px GuessWhat`;

    const textWidth =
      context.measureText(element.textContent).width;

    if(textWidth <= maxWidth) break;

    fontSize -= 1;

  }

  element.style.fontSize = fontSize + 'px';

}

/* إنشاء الصورة */

async function generateCard(){

  const nameValue =
    document.getElementById("employeeName")
    .value
    .trim();

  if(!nameValue){

    alert("الرجاء إدخال اسمك!");

    return;

  }

  const hiddenContainer =
    document.getElementById("hiddenContainer");

  const nameDisplay =
    document.getElementById("nameDisplay");

  hiddenContainer.className =
    'hidden-container ' + selectedDesign;

  nameDisplay.textContent = nameValue;

  adjustFontSize(nameDisplay, 520);

  const imageUrls = {

    design1: 'https://i.imgur.com/dWiUUH1.png',

    design2: 'https://i.imgur.com/Ay45lB6.png'

  };

  try {

    await preloadImage(imageUrls[selectedDesign]);

    await new Promise(r => setTimeout(r, 400));

    const canvas = await html2canvas(hiddenContainer, {

      scale:3,

      useCORS:true,

      allowTaint:true,

      backgroundColor:null

    });

    const imgData = canvas.toDataURL("image/png");

    const link = document.createElement('a');

    link.download = `معايدة_${nameValue}.png`;

    link.href = imgData;

    link.click();

  }

  catch(error){

    console.error(error);

    alert("حدث خطأ أثناء إنشاء الصورة");

  }

}

</script>

</body>
</html>
