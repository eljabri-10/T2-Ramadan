<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بطاقة المعايدة</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@600&display=swap" rel="stylesheet">

<style>

@font-face {
  font-family: 'GuessWhat';
  src: url('Guesswhat-Exceptional.woff2') format('woff2');
}

html, body{
  margin:0;
  padding:0;
  background-color:#f7f6da;
  font-family:'IBM Plex Sans Arabic', sans-serif;
  text-align:center;
}

.main-container{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  padding:30px 10px;
}

.company-logo{
  height:60px;
  margin-bottom:20px;
}

.input-group{
  display:flex;
  flex-direction:column;
  gap:10px;
  width:100%;
  max-width:420px;
}

input,button{
  padding:15px;
  font-size:1.2rem;
  border-radius:8px;
  border:1px solid #ccc;
  text-align:center;
}

button{
  background:#269b55;
  color:#fff;
  border:none;
  cursor:pointer;
  font-weight:600;
}

button:hover{
  background:#1f7e45;
}

.design-options{
  display:flex;
  gap:10px;
  justify-content:center;
}

.design-thumb{
  width:140px;
  cursor:pointer;
  border:3px solid transparent;
  border-radius:12px;
  transition:0.2s;
}

.design-thumb.selected{
  border-color:#269b55;
  box-shadow:0 0 10px rgba(38,155,85,0.4);
}

.hidden-container{
  position:absolute;
  top:-9999px;
  left:-9999px;

  width:1080px;
  height:1350px;

  background-repeat:no-repeat;
  background-position:center;
  background-size:cover;
}

/* الخلفيات */
.design1{
  background-image:url('https://i.imgur.com/dWiUUH1.png');
}

.design2{
  background-image:url('https://i.imgur.com/Ay45lB6.png');
}

/* الاسم */
.name{
  position:absolute;

  left:50%;
  transform:translateX(-50%);

  bottom:176px;

  width:560px;
  height:70px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#269b55;

  font-family:'GuessWhat', sans-serif;
  font-weight:400;
  font-size:30px;

  text-align:center;
  line-height:1;

  white-space:nowrap;
  overflow:hidden;
}

</style>
</head>

<body>

<div class="main-container">

  <img src="https://i.imgur.com/m4SOhEP.png" class="company-logo">

  <h2>أدخل اسمك واختر تصميم المعايدة</h2>

  <div class="input-group">

    <input type="text" id="employeeName" placeholder="أدخل اسمك">

    <div class="design-options">

      <img
        src="https://i.imgur.com/dWiUUH1.png"
        class="design-thumb selected"
        data-design="design1"
      >

      <img
        src="https://i.imgur.com/Ay45lB6.png"
        class="design-thumb"
        data-design="design2"
      >

    </div>

    <button onclick="generateCard()">
      تحميل الصورة
    </button>

  </div>

</div>

<!-- التصميم المخفي -->
<div class="hidden-container design1" id="hiddenContainer">

  <div class="name" id="nameDisplay">
    اسم الموظف
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>

let selectedDesign = "design1";

/* اختيار التصميم */
document.querySelectorAll('.design-thumb').forEach(img => {

  img.addEventListener('click', () => {

    document.querySelectorAll('.design-thumb')
      .forEach(i => i.classList.remove('selected'));

    img.classList.add('selected');

    selectedDesign = img.dataset.design;

  });

});

/* تحميل الصورة */
function preloadImage(url){

  return new Promise((resolve, reject) => {

    const img = new Image();

    img.crossOrigin = "Anonymous";

    img.onload = () => resolve(img);

    img.onerror = () => reject();

    img.src = url;

  });

}

/* تصغير الخط تلقائياً */
function adjustFontSize(element, maxWidth){

  let fontSize = 30;

  const minFontSize = 18;

  const context = document
    .createElement("canvas")
    .getContext("2d");

  while(fontSize >= minFontSize){

    context.font =
      `400 ${fontSize}px GuessWhat`;

    const textWidth =
      context.measureText(element.textContent).width;

    if(textWidth <= maxWidth) break;

    fontSize -= 1;

  }

  element.style.fontSize = fontSize + 'px';

}

/* إنشاء الصورة */
async function generateCard(){

  const nameValue =
    document.getElementById("employeeName")
    .value
    .trim();

  if(!nameValue){

    alert("الرجاء إدخال اسمك!");

    return;

  }

  const hiddenContainer =
    document.getElementById("hiddenContainer");

  const nameDisplay =
    document.getElementById("nameDisplay");

  hiddenContainer.className =
    'hidden-container ' + selectedDesign;

  nameDisplay.textContent = nameValue;

  adjustFontSize(nameDisplay, 520);

  const imageUrls = {

    design1: 'https://i.imgur.com/dWiUUH1.png',

    design2: 'https://i.imgur.com/Ay45lB6.png'

  };

  try {

    await preloadImage(imageUrls[selectedDesign]);

    await new Promise(r => setTimeout(r, 400));

    const canvas = await html2canvas(hiddenContainer, {

      scale:3,

      useCORS:true,

      allowTaint:true,

      backgroundColor:null

    });

    const imgData = canvas.toDataURL("image/png");

    const link = document.createElement('a');

    link.download = `معايدة_${nameValue}.png`;

    link.href = imgData;

    link.click();

  }

  catch(error){

    console.error(error);

    alert("حدث خطأ أثناء إنشاء الصورة");

  }

}

</script>

</body>
</html>
